name: CI
run-name: PyAhead autopilot ${{ inputs.pyahead_autopilot_token }}

env:
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      pyahead_autopilot_token:
        description: One-time token binding an autopilot candidate to this run
        required: true
        type: string

permissions:
  contents: read

jobs:
  quality:
    name: Quality and Gate B / Linux / Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.11.21" # Reviewed M8 dependency-resolver grammar.

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy src

      - name: Test with coverage
        run: uv run pytest

      - name: Validate registry
        run: uv run pyahead registry validate

      - name: Check registry coverage
        run: uv run pyahead registry coverage

      - name: Enforce performance budgets
        run: uv run python scripts/benchmark.py --repeat 1 --output -

  tests:
    name: Tests / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.11"
          - os: macos-latest
            python: "3.14"
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.11.21" # Reviewed M8 dependency-resolver grammar.

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest

  prerelease:
    name: Prerelease / ubuntu-latest / Python 3.15
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up prerelease Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          allow-prereleases: true

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.11.21" # Reviewed M8 dependency-resolver grammar.

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest

  build:
    name: Build wheel and sdist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.11.21" # Reviewed M8 dependency-resolver grammar.

      - name: Build distributions
        run: uv build

  install:
    name: Install wheel and sdist / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.11"
          - os: macos-latest
            python: "3.14"
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.11.21" # Reviewed M8 dependency-resolver grammar.

      - name: Create empty installer cache
        env:
          PYAHEAD_INSTALLER_CACHE: ${{ runner.temp }}/pyahead-install-cache
        run: python -c "import os,pathlib; pathlib.Path(os.environ['PYAHEAD_INSTALLER_CACHE']).mkdir()"

      - name: Sync locked smoke runner
        run: uv sync --frozen --cache-dir "${{ runner.temp }}/pyahead-install-cache"

      - name: Build distributions
        run: uv build --offline --cache-dir "${{ runner.temp }}/pyahead-install-cache"

      - name: Install and scan online from wheel; prepare installer cache
        run: uv run --frozen --offline --cache-dir "${{ runner.temp }}/pyahead-install-cache" python scripts/install_smoke.py --dist-dir dist --kind wheel --installer-cache "${{ runner.temp }}/pyahead-install-cache"

      - name: Install and scan online from sdist; prepare installer cache
        run: uv run --frozen --offline --cache-dir "${{ runner.temp }}/pyahead-install-cache" python scripts/install_smoke.py --dist-dir dist --kind sdist --installer-cache "${{ runner.temp }}/pyahead-install-cache"

      - name: Install and scan offline from wheel
        run: uv run --frozen --offline --cache-dir "${{ runner.temp }}/pyahead-install-cache" python scripts/install_smoke.py --dist-dir dist --kind wheel --offline --installer-cache "${{ runner.temp }}/pyahead-install-cache"

      - name: Install and scan offline from sdist
        run: uv run --frozen --offline --cache-dir "${{ runner.temp }}/pyahead-install-cache" python scripts/install_smoke.py --dist-dir dist --kind sdist --offline --installer-cache "${{ runner.temp }}/pyahead-install-cache"
