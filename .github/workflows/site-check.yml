name: Site check

# Pages deploys this branch directly, so a failing check cannot stop a deploy.
# This runs anyway: it is what makes a broken pin visible before it is merged.
# Never merge a change to the pinned Pyodide or PyAhead version on a red run.

on:
  push:
    branches: ["gh-pages"]
  pull_request:
    branches: ["gh-pages"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    name: Pinned PyAhead under pinned Pyodide
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the site
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install check dependencies
        working-directory: check
        run: npm install

      - name: Verify the harness
        run: node check/harness-check.mjs

      - name: Verify the fetching layer
        run: node check/github-check.mjs

      - name: Verify the renderer
        run: node check/render-check.mjs

      - name: Install browsers
        working-directory: check
        run: npx playwright install --with-deps chromium webkit

      - name: Verify the site in Chromium
        run: node check/browser-check.mjs
        env:
          BROWSER: chromium

      # WebKit is what Safari is, and Safari is where this page gets used.
      # Chromium passing is not evidence that Safari does.
      - name: Verify the site in WebKit
        run: node check/browser-check.mjs
        env:
          BROWSER: webkit

  parity:
    name: The browser answer matches the command line
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the site
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the published PyAhead
        run: pip install "pyahead==0.2.2"

      # The same tag the browser is pointed at, so any difference is the
      # runtime and not the code being compared.
      - name: Scan the parity target with the CLI
        run: |
          curl -sL -o target.tar.gz https://codeload.github.com/psf/requests/tar.gz/refs/tags/v2.32.3
          mkdir target && tar xzf target.tar.gz -C target --strip-components=1
          # The report must land beneath the project root, so write it there
          # and move it out afterwards.
          cd target
          set +e
          pyahead check . \
            --baseline-python 3.11 --horizon-python 3.14 \
            --format json --output local.json --fail-on never
          code=$?
          set -e
          # 3 means the scan was incomplete, which this target genuinely is:
          # two files in it cannot be parsed. Incompleteness takes precedence
          # over --fail-on never by design. Anything else is a real failure.
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then exit "$code"; fi
          mv local.json ../local.json

      - name: Install check dependencies
        working-directory: check
        run: npm install

      - name: Install Chromium
        working-directory: check
        run: npx playwright install --with-deps chromium

      - name: Compare, and measure three repositories
        run: node check/parity-check.mjs
