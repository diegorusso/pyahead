schema_version: 1
id: CPY0138
title: "The parser module is removed"
summary: >-
  The parser standard-library module is deprecated in Python 3.9, when CPython
  switched to the PEG parser, and removed in Python 3.10.

scope:
  ecosystem: python
  runtime: cpython
  contexts: [runtime]

subject:
  kind: module
  name: parser

timeline:
  - event: deprecated
    python: "3.9"
    certainty: released
    source: python-3.9-deprecated
  - event: removed
    python: "3.10"
    certainty: released
    source: python-3.10-removed

impact:
  on_deprecation: deprecated
  on_removal: breaking

matchers:
  - kind: module-import
    module: parser
  - kind: literal-dynamic-import
    module: parser
    confidence: medium

remediation:
  summary: >-
    Use the ast module to parse and compile source; the concrete syntax trees
    the parser module produced have no replacement.
  documentation_url: "https://docs.python.org/3.9/whatsnew/3.9.html#deprecated"
  automation: null

sources:
  - id: python-3.9-deprecated
    title: "What's New in Python 3.9 — Deprecated"
    url: "https://docs.python.org/3.9/whatsnew/3.9.html#deprecated"
  - id: python-3.10-removed
    title: "What's New in Python 3.10 — Removed"
    url: "https://docs.python.org/3.10/whatsnew/3.10.html#removed"

tags: [stdlib, module-removal, pep-617]
