schema_version: 1
id: CPY0177
title: "The use_builtin_types parameter is removed from plistlib"
summary: >-
  The keyword-only use_builtin_types parameter of plistlib.load() and plistlib.loads() is removed in Python 3.9; bytes objects are always used. It belongs to the old API deprecated in Python 3.4.

scope:
  ecosystem: python
  runtime: cpython
  contexts: [runtime]

subject:
  kind: module
  name: plistlib

timeline:
  - event: deprecated
    python: "3.4"
    certainty: released
    source: python-3.9-removed
  - event: removed
    python: "3.9"
    certainty: released
    source: python-3.9-removed

impact:
  on_deprecation: deprecated
  on_removal: breaking

matchers:
  - kind: call-shape
    qualified_name: plistlib.load
    required_keywords: [use_builtin_types]
  - kind: call-shape
    qualified_name: plistlib.loads
    required_keywords: [use_builtin_types]

remediation:
  summary: >-
    Drop the argument; plistlib returns bytes objects unconditionally.
  documentation_url: "https://docs.python.org/3.9/whatsnew/3.9.html#removed"
  automation: null

sources:
  - id: python-3.9-removed
    title: "What's New in Python 3.9 — Removed"
    url: "https://docs.python.org/3.9/whatsnew/3.9.html#removed"

tags: [stdlib, plistlib, parameter-removal]
