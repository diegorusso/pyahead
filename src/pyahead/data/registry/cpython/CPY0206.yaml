title: "webbrowser.MacOSXOSAScript is deprecated"
summary: >-
  webbrowser.MacOSXOSAScript is deprecated in Python 3.15 in favour of
  webbrowser.MacOS. Its scheduled Python 3.17 removal is outside this
  registry's supported window.

