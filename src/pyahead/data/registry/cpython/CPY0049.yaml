schema_version: 1
id: CPY0049
title: "Legacy glob helpers are scheduled for removal"
summary: >-
  glob.glob0 and glob.glob1 are deprecated in Python 3.13 and scheduled for removal in Python 3.15.

scope:
  ecosystem: python
  runtime: cpython
  contexts: [runtime]

subject:
  kind: function
  name: glob.glob0

timeline:
  - event: deprecated
    python: "3.13"
    certainty: released
    source: python-3.13-deprecated
  - event: removed
    python: "3.15"
    certainty: scheduled
    source: python-3.15-removed

impact:
  on_deprecation: deprecated
  on_removal: breaking

matchers:
  - kind: qualified-reference
    qualified_name: glob.glob0
  - kind: qualified-reference
    qualified_name: glob.glob1

remediation:
  summary: >-
    Use glob.glob with its root_dir argument as directed by the linked CPython documentation.
  documentation_url: "https://docs.python.org/3.15/whatsnew/3.15.html#glob"
  automation: null

sources:
  - id: python-3.13-deprecated
    title: "What's New in Python 3.13 — New Deprecations"
    url: "https://docs.python.org/3.13/whatsnew/3.13.html#glob"
  - id: python-3.15-removed
    title: "What's New in Python 3.15 — glob removals"
    url: "https://docs.python.org/3.15/whatsnew/3.15.html#glob"

tags: [stdlib, scheduled-removal, glob]
