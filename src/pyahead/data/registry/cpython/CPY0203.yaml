schema_version: 1
id: CPY0203
title: "inspect.Signature.from_builtin is removed"
summary: >-
  The undocumented inspect.Signature.from_builtin() is deprecated in Python 3.5 and removed in Python 3.11.

scope:
  ecosystem: python
  runtime: cpython
  contexts: [runtime]

subject:
  kind: function
  name: inspect.Signature.from_builtin

timeline:
  - event: deprecated
    python: "3.5"
    certainty: released
    source: python-3.11-removed
  - event: removed
    python: "3.11"
    certainty: released
    source: python-3.11-removed

impact:
  on_deprecation: deprecated
  on_removal: breaking

matchers:
  - kind: qualified-reference
    qualified_name: inspect.Signature.from_builtin

remediation:
  summary: >-
    Use inspect.Signature.from_callable().
  documentation_url: "https://docs.python.org/3.11/whatsnew/3.11.html#removed"
  automation: null

sources:
  - id: python-3.11-removed
    title: "What's New in Python 3.11 — Removed"
    url: "https://docs.python.org/3.11/whatsnew/3.11.html#removed"

tags: [stdlib, inspect, function-removal]
