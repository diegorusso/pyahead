schema_version: 1
id: CPY0192
title: "ast.ExtSlice is deprecated"
summary: >-
  ast.ExtSlice is deprecated in Python 3.9, when subscripts stopped wrapping their values in slice nodes. It remains importable through Python 3.14 and its removal is not scheduled.

scope:
  ecosystem: python
  runtime: cpython
  contexts: [runtime]

subject:
  kind: class
  name: ast.ExtSlice

timeline:
  - event: deprecated
    python: "3.9"
    certainty: released
    source: python-3.9-deprecated

impact:
  on_deprecation: deprecated

matchers:
  - kind: qualified-reference
    qualified_name: ast.ExtSlice

remediation:
  summary: >-
    Use ast.Tuple(slices, ast.Load()) instead of ast.ExtSlice(...).
  documentation_url: "https://docs.python.org/3.9/whatsnew/3.9.html#deprecated"
  automation: null

sources:
  - id: python-3.9-deprecated
    title: "What's New in Python 3.9 — Deprecated"
    url: "https://docs.python.org/3.9/whatsnew/3.9.html#deprecated"

tags: [stdlib, ast, unscheduled-removal]
