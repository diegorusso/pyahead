schema_version: 1
id: CPY0170
title: "The _dummy_thread module is removed"
summary: >-
  _dummy_thread is deprecated in Python 3.7, which requires threading support, and removed in Python 3.9.

scope:
  ecosystem: python
  runtime: cpython
  contexts: [runtime]

subject:
  kind: module
  name: _dummy_thread

timeline:
  - event: deprecated
    python: "3.7"
    certainty: released
    source: python-3.9-removed
  - event: removed
    python: "3.9"
    certainty: released
    source: python-3.9-removed

impact:
  on_deprecation: deprecated
  on_removal: breaking

matchers:
  - kind: module-import
    module: _dummy_thread
  - kind: literal-dynamic-import
    module: _dummy_thread
    confidence: medium

remediation:
  summary: >-
    Import _thread or, preferably, threading.
  documentation_url: "https://docs.python.org/3.9/whatsnew/3.9.html#removed"
  automation: null

sources:
  - id: python-3.9-removed
    title: "What's New in Python 3.9 — Removed"
    url: "https://docs.python.org/3.9/whatsnew/3.9.html#removed"

tags: [stdlib, module-removal]
