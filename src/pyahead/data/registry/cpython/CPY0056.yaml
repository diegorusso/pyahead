schema_version: 1
id: CPY0056
title: "Wave marker methods are scheduled for removal"
summary: >-
  The Wave_read and Wave_write marker methods are deprecated in Python 3.13 and scheduled for removal in Python 3.15; PyAhead matches class-qualified references.

scope:
  ecosystem: python
  runtime: cpython
  contexts: [runtime]

subject:
  kind: attribute
  name: wave.Wave_read.getmark

timeline:
  - event: deprecated
    python: "3.13"
    certainty: released
    source: python-3.13-deprecated
  - event: removed
    python: "3.15"
    certainty: scheduled
    source: python-3.15-removed

impact:
  on_deprecation: deprecated
  on_removal: breaking

matchers:
  - kind: qualified-reference
    qualified_name: wave.Wave_read.getmark
  - kind: qualified-reference
    qualified_name: wave.Wave_read.getmarkers
  - kind: qualified-reference
    qualified_name: wave.Wave_write.setmark
  - kind: qualified-reference
    qualified_name: wave.Wave_write.getmark
  - kind: qualified-reference
    qualified_name: wave.Wave_write.getmarkers

remediation:
  summary: >-
    Remove use of the unsupported marker methods described by the linked wave documentation.
  documentation_url: "https://docs.python.org/3.15/whatsnew/3.15.html#wave"
  automation: null

sources:
  - id: python-3.13-deprecated
    title: "What's New in Python 3.13 — wave deprecations"
    url: "https://docs.python.org/3.13/whatsnew/3.13.html#wave"
  - id: python-3.15-removed
    title: "What's New in Python 3.15 — wave removals"
    url: "https://docs.python.org/3.15/whatsnew/3.15.html#wave"

tags: [stdlib, scheduled-removal, wave, partial]
