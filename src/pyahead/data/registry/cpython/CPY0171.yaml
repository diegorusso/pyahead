schema_version: 1
id: CPY0171
title: "wave.openfp is removed"
summary: >-
  wave.openfp() is an alias of wave.open(), deprecated in Python 3.7 and removed in Python 3.9. The matching aifc and sunau aliases are covered by those modules' own removal in Python 3.13.

scope:
  ecosystem: python
  runtime: cpython
  contexts: [runtime]

subject:
  kind: function
  name: wave.openfp

timeline:
  - event: deprecated
    python: "3.7"
    certainty: released
    source: python-3.9-removed
  - event: removed
    python: "3.9"
    certainty: released
    source: python-3.9-removed

impact:
  on_deprecation: deprecated
  on_removal: breaking

matchers:
  - kind: qualified-reference
    qualified_name: wave.openfp

remediation:
  summary: >-
    Call wave.open().
  documentation_url: "https://docs.python.org/3.9/whatsnew/3.9.html#removed"
  automation: null

sources:
