schema_version: 1
id: CPY0135
title: "CodeType.co_lnotab is removed"
summary: >-
  types.CodeType.co_lnotab was deprecated in Python 3.10 by PEP 626, began
  emitting a DeprecationWarning in Python 3.12, and is removed in Python 3.15.

scope:
  ecosystem: python
  runtime: cpython
  contexts: [runtime]

subject:
  kind: attribute
  name: types.CodeType.co_lnotab

timeline:
  - event: deprecated
    python: "3.10"
    certainty: released
    source: python-3.10-pep-626
  - event: removed
    python: "3.15"
    certainty: released
    source: python-3.15-removed

impact:
  on_deprecation: deprecated
  on_removal: breaking

matchers:
  - kind: qualified-reference
    qualified_name: types.CodeType.co_lnotab

remediation:
  summary: >-
    Use CodeType.co_lines() for line-number information as described by PEP 626.
  documentation_url: "https://docs.python.org/3.10/whatsnew/3.10.html#pep-626-precise-line-numbers-for-debugging-and-other-tools"
  automation: null

