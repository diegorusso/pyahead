        equals: "mosaic"
  - kind: call-shape
    qualified_name: webbrowser.get
    literal_arguments:
      - keyword: using
        equals: "mosaic"
  - kind: call-shape
    qualified_name: webbrowser.get
    literal_arguments:
      - position: 0
        equals: "netscape"
  - kind: call-shape
    qualified_name: webbrowser.get
    literal_arguments:
      - keyword: using
        equals: "netscape"
  - kind: call-shape
    qualified_name: webbrowser.get
    literal_arguments:
      - position: 0
        equals: "galeon"
  - kind: call-shape
