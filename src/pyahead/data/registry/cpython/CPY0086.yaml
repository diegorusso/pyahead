schema_version: 1
id: CPY0086
title: "Obsolete webbrowser controllers are removed"
summary: >-
  Support for the Grail, Mosaic, Netscape, Galeon, Skipstone, Iceape, and Firebird browser controllers is removed in Python 3.12.

scope:
  ecosystem: python
  runtime: cpython
  contexts: [runtime]

subject:
  kind: function
  name: webbrowser.get

timeline:
  - event: support_dropped
    python: "3.12"
    certainty: released
    source: python-3.12-removed

impact:
  on_support_drop: breaking

matchers:
  - kind: call-shape
    qualified_name: webbrowser.get
    literal_arguments:
      - position: 0
        equals: "grail"
  - kind: call-shape
    qualified_name: webbrowser.get
    literal_arguments:
      - keyword: using
        equals: "grail"
  - kind: call-shape
    qualified_name: webbrowser.get
    literal_arguments:
