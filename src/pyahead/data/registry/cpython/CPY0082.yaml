schema_version: 1
id: CPY0082
title: "Legacy TLS configuration parameters are removed"
summary: >-
  Deprecated key-file, certificate-file, and hostname-check parameters on standard-library TLS clients are removed in Python 3.12.

scope:
  ecosystem: python
  runtime: cpython
  contexts: [runtime]

subject:
  kind: function
  name: http.client.HTTPSConnection

timeline:
  - event: signature_changed
    python: "3.12"
    certainty: released
    source: python-3.12-removed

impact:
  on_signature_change: breaking

matchers:
  - kind: call-shape
    qualified_name: ftplib.FTP_TLS
    required_keywords: [keyfile]
  - kind: call-shape
    qualified_name: ftplib.FTP_TLS
    required_keywords: [certfile]
  - kind: call-shape
    qualified_name: ftplib.FTP_TLS
    min_positional_args: 5
  - kind: call-shape
    qualified_name: imaplib.IMAP4_SSL
    required_keywords: [keyfile]
  - kind: call-shape
    qualified_name: imaplib.IMAP4_SSL
    required_keywords: [certfile]
  - kind: call-shape
    qualified_name: imaplib.IMAP4_SSL
    min_positional_args: 3
  - kind: call-shape
    qualified_name: poplib.POP3_SSL
    required_keywords: [keyfile]
  - kind: call-shape
    qualified_name: poplib.POP3_SSL
    required_keywords: [certfile]
  - kind: call-shape
    qualified_name: poplib.POP3_SSL
    min_positional_args: 3
  - kind: call-shape
