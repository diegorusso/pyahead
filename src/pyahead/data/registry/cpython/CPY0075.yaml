schema_version: 1
id: CPY0075
title: "shlex.split no longer accepts None"
summary: >-
  Passing None as the first argument to shlex.split becomes invalid in Python 3.12.

scope:
  ecosystem: python
  runtime: cpython
  contexts: [runtime]

subject:
  kind: function
  name: shlex.split

timeline:
  - event: behavior_changed
    python: "3.12"
    certainty: released
    source: python-3.12-porting

impact:
  on_behavior_change: breaking

matchers:
  - kind: call-shape
    qualified_name: shlex.split
    literal_arguments:
      - position: 0
        equals: null
  - kind: call-shape
    qualified_name: shlex.split
    literal_arguments:
      - keyword: s
        equals: null

remediation:
  summary: >-
    Pass an explicit string to shlex.split.
  documentation_url: "https://docs.python.org/3.12/whatsnew/3.12.html#changes-in-the-python-api"
  automation: null

sources:
  - id: python-3.12-porting
    title: "What's New in Python 3.12 — Porting to Python 3.12 › Changes in the Python API"
    url: "https://docs.python.org/3.12/whatsnew/3.12.html#changes-in-the-python-api"

tags: [stdlib, behavior-change, shlex]
