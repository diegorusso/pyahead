schema_version: 1
id: CPY0038
title: "sqlite3 version metadata is removed"
summary: >-
  sqlite3.version and sqlite3.version_info are deprecated in Python 3.12 and removed in Python 3.14.

scope:
  ecosystem: python
  runtime: cpython
  contexts: [runtime]

subject:
  kind: attribute
  name: sqlite3.version

timeline:
  - event: deprecated
    python: "3.12"
    certainty: released
    source: python-3.12-deprecated
  - event: removed
    python: "3.14"
    certainty: released
    source: python-3.14-removed

impact:
  on_deprecation: deprecated
  on_removal: breaking

matchers:
  - kind: qualified-reference
    qualified_name: sqlite3.version
  - kind: qualified-reference
    qualified_name: sqlite3.version_info

remediation:
  summary: >-
    Remove reliance on the pysqlite package-version attributes; consult the sqlite3 documentation for supported version information.
  documentation_url: "https://docs.python.org/3.12/whatsnew/3.12.html#pending-removal-in-python-3-14"
  automation: null

sources:
  - id: python-3.12-deprecated
    title: "What's New in Python 3.12 — Deprecated › Pending Removal in Python 3.14"
    url: "https://docs.python.org/3.12/whatsnew/3.12.html#pending-removal-in-python-3-14"
  - id: python-3.14-removed
    title: "What's New in Python 3.14 — Removed › sqlite3"
    url: "https://docs.python.org/3.14/whatsnew/3.14.html#sqlite3"

tags: [stdlib, api-removal, sqlite]

