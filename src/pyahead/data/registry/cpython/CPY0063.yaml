title: "TarFile.tarfile is scheduled for removal"
summary: >-
  The undocumented tarfile.TarFile.tarfile attribute is deprecated in Python 3.13 and scheduled for removal in Python 3.16; PyAhead matches class-qualified references.

scope:
  ecosystem: python
  runtime: cpython
  contexts: [runtime]

subject:
  kind: attribute
  name: tarfile.TarFile.tarfile

timeline:
