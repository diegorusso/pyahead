schema_version: 1
id: CPY0129
title: "EnumMeta.__getattr__ is removed"
summary: >-
  enum.EnumMeta.__getattr__ is removed in Python 3.12 because it is no longer
  needed for enum attribute access.

scope:
  ecosystem: python
  runtime: cpython
  contexts: [runtime]

subject:
  kind: attribute
  name: enum.EnumMeta.__getattr__

timeline:
  - event: removed
    python: "3.12"
    certainty: released
    source: python-3.12-removed

impact:
  on_removal: breaking

matchers:
  - kind: qualified-reference
    qualified_name: enum.EnumMeta.__getattr__
  - kind: qualified-reference
    qualified_name: enum.EnumType.__getattr__

remediation:
  summary: >-
    Remove direct use of EnumMeta.__getattr__ and use supported enum attribute
    access described by the current enum documentation.
  documentation_url: "https://docs.python.org/3.12/whatsnew/3.12.html#enum"
  automation: null

sources:
  - id: python-3.12-removed
    title: "What's New in Python 3.12 — enum removals"
    url: "https://docs.python.org/3.12/whatsnew/3.12.html#enum"

tags: [stdlib, api-removal, enum, partial]
