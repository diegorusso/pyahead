schema_version: 1
id: CPY0190
title: "binascii.rledecode_hqx is removed"
summary: >-
  binascii.rledecode_hqx() belongs to the binhex4 support deprecated in Python 3.9 and removed in Python 3.11.

scope:
  ecosystem: python
  runtime: cpython
  contexts: [runtime]

subject:
  kind: function
  name: binascii.rledecode_hqx

timeline:
  - event: deprecated
    python: "3.9"
    certainty: released
    source: python-3.9-deprecated
  - event: removed
    python: "3.11"
    certainty: released
    source: python-3.11-removed

impact:
  on_deprecation: deprecated
  on_removal: breaking

matchers:
  - kind: qualified-reference
    qualified_name: binascii.rledecode_hqx

remediation:
  summary: >-
    Drop binhex4 encoding; the format is obsolete and has no standard-library replacement.
  documentation_url: "https://docs.python.org/3.9/whatsnew/3.9.html#deprecated"
  automation: null

sources:
