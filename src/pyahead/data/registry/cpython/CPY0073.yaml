schema_version: 1
id: CPY0073
title: "Legacy unittest APIs are removed"
summary: >-
  Deprecated unittest.TestCase aliases and related legacy loader features are removed in Python 3.12; PyAhead matches class-qualified references and explicit use_load_tests keywords.

scope:
  ecosystem: python
  runtime: cpython
  contexts: [runtime]

subject:
  kind: attribute
  name: unittest.TestCase.assertEquals

timeline:
  - event: removed
    python: "3.12"
    certainty: released
    source: python-3.12-removed

impact:
  on_removal: breaking

