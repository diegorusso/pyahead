schema_version: 1
id: CPY0031
title: "Legacy unittest loader helpers are removed"
summary: >-
  unittest.findTestCases, unittest.makeSuite, and unittest.getTestCaseNames are deprecated in Python 3.11 and removed in Python 3.13.

scope:
  ecosystem: python
  runtime: cpython
  contexts: [runtime]

subject:
  kind: function
  name: unittest.makeSuite

timeline:
  - event: deprecated
    python: "3.11"
    certainty: released
    source: python-3.11-deprecated
  - event: removed
    python: "3.13"
    certainty: released
    source: python-3.13-removed

impact:
  on_deprecation: deprecated
  on_removal: breaking

matchers:
  - kind: qualified-reference
    qualified_name: unittest.findTestCases
  - kind: qualified-reference
    qualified_name: unittest.makeSuite
  - kind: qualified-reference
    qualified_name: unittest.getTestCaseNames

remediation:
  summary: >-
    Use the corresponding unittest.TestLoader methods documented in the linked release notes.
  documentation_url: "https://docs.python.org/3.11/whatsnew/3.11.html#standard-library"
  automation: null

sources:
  - id: python-3.11-deprecated
    title: "What's New in Python 3.11 — Deprecated › Standard Library"
    url: "https://docs.python.org/3.11/whatsnew/3.11.html#standard-library"
  - id: python-3.13-removed
    title: "What's New in Python 3.13 — Removed Modules And APIs › unittest"
    url: "https://docs.python.org/3.13/whatsnew/3.13.html#unittest"

tags: [stdlib, api-removal, unittest]

