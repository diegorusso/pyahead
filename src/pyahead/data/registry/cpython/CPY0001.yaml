schema_version: 1
id: CPY0001
title: "The cgi module is removed"
summary: >-
  The cgi standard-library module is deprecated in Python 3.11 and removed in
  Python 3.13.

scope:
  ecosystem: python
  runtime: cpython
  contexts: [runtime]

subject:
  kind: module
  name: cgi

timeline:
  - event: deprecated
    python: "3.11"
    certainty: released
    source: pep-0594
  - event: removed
    python: "3.13"
    certainty: released
    source: python-3.13-cgi

impact:
  on_deprecation: deprecated
  on_removal: breaking

matchers:
  - kind: module-import
    module: cgi

remediation:
  summary: >-
    Replace the specific cgi functionality in use. There is no single drop-in
    replacement for the complete module.
  automation: null

sources:
  - id: pep-0594
    title: "PEP 594 — Removing dead batteries from the standard library"
    url: "https://peps.python.org/pep-0594/"
  - id: python-3.13-cgi
    title: "cgi — Common Gateway Interface support"
    url: "https://docs.python.org/3.13/library/cgi.html"

tags: [stdlib, module-removal, pep-594]
