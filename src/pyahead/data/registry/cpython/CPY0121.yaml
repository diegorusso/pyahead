schema_version: 1
id: CPY0121
title: "TLS-disabling option constants are deprecated"
summary: >-
  The ssl.OP_NO_TLS version option constants have been deprecated since Python 3.7.

scope:
  ecosystem: python
  runtime: cpython
  contexts: [runtime]

subject:
  kind: attribute
  name: ssl.OP_NO_TLSv1

timeline:
  - event: deprecated
    python: "3.7"
    certainty: released
    source: python-3.7-ssl

impact:
  on_deprecation: deprecated

matchers:
  - kind: qualified-reference
    qualified_name: ssl.OP_NO_TLSv1
  - kind: qualified-reference
    qualified_name: ssl.OP_NO_TLSv1_1
  - kind: qualified-reference
    qualified_name: ssl.OP_NO_TLSv1_2
  - kind: qualified-reference
    qualified_name: ssl.OP_NO_TLSv1_3

remediation:
  summary: >-
    Configure SSLContext.minimum_version and SSLContext.maximum_version instead.
  documentation_url: "https://docs.python.org/3.7/library/ssl.html#ssl.OP_NO_TLSv1"
  automation: null

sources:
  - id: python-3.7-ssl
    title: "Python 3.7 ssl documentation — OP_NO_TLSv1"
    url: "https://docs.python.org/3.7/library/ssl.html#ssl.OP_NO_TLSv1"
  - id: python-3.10-deprecated
    title: "What's New in Python 3.10 — Deprecated"
    url: "https://docs.python.org/3.10/whatsnew/3.10.html#deprecated"

tags: [stdlib, unscheduled-removal, ssl]
