schema_version: 1
id: CPY0115
title: "importlib cache_from_source debug_override is deprecated"
summary: >-
  The debug_override parameter of importlib.util.cache_from_source has been deprecated since Python 3.5.

scope:
  ecosystem: python
  runtime: cpython
  contexts: [runtime]

subject:
  kind: function
  name: importlib.util.cache_from_source

timeline:
  - event: deprecated
    python: "3.5"
    certainty: released
    source: python-3.5-porting

impact:
  on_deprecation: deprecated

matchers:
  - kind: call-shape
    qualified_name: importlib.util.cache_from_source
    min_positional_args: 2
  - kind: call-shape
    qualified_name: importlib.util.cache_from_source
    required_keywords: [debug_override]

remediation:
  summary: >-
    Pass the optimization parameter instead of debug_override.
  documentation_url: "https://docs.python.org/3.5/whatsnew/3.5.html#changes-in-the-python-api"
  automation: null

sources:
  - id: python-3.5-porting
    title: "What's New in Python 3.5 — Porting to Python 3.5 › Changes in the Python API"
    url: "https://docs.python.org/3.5/whatsnew/3.5.html#changes-in-the-python-api"

tags: [stdlib, unscheduled-removal, importlib]
