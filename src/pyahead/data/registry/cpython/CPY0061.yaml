schema_version: 1
id: CPY0061
title: "Bitwise inversion of bool is scheduled to fail"
summary: >-
  Bitwise inversion of the True and False literals is deprecated in Python 3.12 and scheduled to raise an error in Python 3.16; the rule intentionally covers literal booleans only.

scope:
  ecosystem: python
  runtime: cpython
  contexts: [runtime]

subject:
  kind: syntax
  name: bool-bitwise-inversion

timeline:
  - event: deprecated
    python: "3.12"
    certainty: released
    source: python-3.12-deprecated
  - event: behavior_changed
    python: "3.16"
    certainty: scheduled
    source: python-3.12-pending-3-16

impact:
  on_deprecation: deprecated
  on_behavior_change: breaking

matchers:
  - kind: builtin-pattern
    pattern: bool-bitwise-inversion

remediation:
  summary: >-
    Replace bitwise inversion with the Boolean operation intended by the program.
  documentation_url: "https://docs.python.org/3.12/whatsnew/3.12.html#deprecated"
  automation: null

sources:
  - id: python-3.12-deprecated
    title: "What's New in Python 3.12 — Deprecated"
    url: "https://docs.python.org/3.12/whatsnew/3.12.html#deprecated"
  - id: python-3.12-pending-3-16
    title: "What's New in Python 3.12 — Deprecated › Pending Removal in Python 3.16"
    url: "https://docs.python.org/3.12/whatsnew/3.12.html#pending-removal-in-python-3-16"

tags: [syntax, scheduled-change, partial]

