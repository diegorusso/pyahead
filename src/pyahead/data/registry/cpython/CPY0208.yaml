  - kind: call-shape
    qualified_name: hashlib.shake_128
    required_keywords: [string]
  - kind: call-shape
    qualified_name: hashlib.shake_256
    required_keywords: [string]

remediation:
  summary: >-
    Pass the initial data positionally, which every Python version accepts.
  documentation_url: "https://docs.python.org/3.15/whatsnew/3.15.html#new-deprecations"
