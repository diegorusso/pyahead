schema_version: 1
id: CPY0166
title: "sys.callstats is removed"
summary: >-
  sys.callstats() is undocumented, deprecated in Python 3.7 when it began always returning None, and removed in Python 3.9.

scope:
  ecosystem: python
  runtime: cpython
  contexts: [runtime]

subject:
  kind: function
  name: sys.callstats

timeline:
  - event: deprecated
    python: "3.7"
    certainty: released
    source: python-3.7-deprecated
  - event: removed
    python: "3.9"
    certainty: released
    source: python-3.9-removed

impact:
  on_deprecation: deprecated
  on_removal: breaking

matchers:
  - kind: qualified-reference
    qualified_name: sys.callstats

remediation:
  summary: >-
    Remove the call; it returned None since Python 3.7 and measured nothing.
  documentation_url: "https://docs.python.org/3.7/whatsnew/3.7.html#deprecated-python-modules-functions-and-methods"
  automation: null

sources:
  - id: python-3.7-deprecated
    title: "What's New in Python 3.7 — Deprecated Python modules, functions and methods"
    url: "https://docs.python.org/3.7/whatsnew/3.7.html#deprecated-python-modules-functions-and-methods"
  - id: python-3.9-removed
    title: "What's New in Python 3.9 — Removed"
    url: "https://docs.python.org/3.9/whatsnew/3.9.html#removed"

tags: [stdlib, sys, function-removal]
