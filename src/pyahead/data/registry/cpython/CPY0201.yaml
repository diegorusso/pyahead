schema_version: 1
id: CPY0201
title: "inspect.getargspec is removed"
summary: >-
  inspect.getargspec() cannot describe keyword-only parameters or annotations. It is deprecated in Python 3.0 and removed in Python 3.11.

scope:
  ecosystem: python
  runtime: cpython
  contexts: [runtime]

subject:
  kind: function
  name: inspect.getargspec

timeline:
  - event: deprecated
    python: "3.0"
    certainty: released
    source: python-3.11-removed
  - event: removed
    python: "3.11"
    certainty: released
    source: python-3.11-removed

impact:
  on_deprecation: deprecated
  on_removal: breaking

matchers:
  - kind: qualified-reference
    qualified_name: inspect.getargspec

remediation:
  summary: >-
    Use inspect.signature(), or inspect.getfullargspec() for the closest shape.
  documentation_url: "https://docs.python.org/3.11/whatsnew/3.11.html#removed"
  automation: null

sources:
  - id: python-3.11-removed
    title: "What's New in Python 3.11 — Removed"
    url: "https://docs.python.org/3.11/whatsnew/3.11.html#removed"

tags: [stdlib, inspect, function-removal]
