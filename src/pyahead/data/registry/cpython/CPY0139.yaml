schema_version: 1
id: CPY0139
title: "The formatter module is removed"
summary: >-
  The formatter standard-library module is pending-deprecated in Python 3.4 and
  removed in Python 3.10; its removal was delayed past the originally scheduled
  3.6 until Python 2.7 compatibility no longer mattered.

scope:
  ecosystem: python
  runtime: cpython
  contexts: [runtime]

subject:
  kind: module
  name: formatter

timeline:
  - event: deprecated
    python: "3.4"
    certainty: released
    source: python-3.4-deprecated
  - event: removed
    python: "3.10"
    certainty: released
    source: python-3.10-removed

impact:
  on_deprecation: deprecated
  on_removal: breaking

matchers:
  - kind: module-import
    module: formatter
  - kind: literal-dynamic-import
    module: formatter
    confidence: medium

remediation:
  summary: >-
    Replace the formatter and writer classes with application code; the module
    was little used and has no standard-library replacement.
  documentation_url: "https://docs.python.org/3.4/whatsnew/3.4.html#deprecations-in-the-python-api"
  automation: null

sources:
  - id: python-3.4-deprecated
    title: "What's New in Python 3.4 — Deprecated › Deprecations in the Python API"
    url: "https://docs.python.org/3.4/whatsnew/3.4.html#deprecations-in-the-python-api"
  - id: python-3.10-removed
    title: "What's New in Python 3.10 — Removed"
    url: "https://docs.python.org/3.10/whatsnew/3.10.html#removed"

tags: [stdlib, module-removal]
