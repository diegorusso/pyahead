title: "The binhex module is removed"
summary: >-
  The binhex module implements the binhex4 and hexbin4 standards, deprecated in Python 3.9 and removed in Python 3.11.

scope:
  ecosystem: python
  runtime: cpython
  contexts: [runtime]

subject:
  kind: module
  name: binhex

timeline:
