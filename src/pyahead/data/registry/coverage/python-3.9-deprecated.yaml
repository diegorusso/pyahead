schema_version: 1
source:
  id: python-3.9-deprecated
  title: "What's New in Python 3.9 — Deprecated"
  url: "https://docs.python.org/3.9/whatsnew/3.9.html#deprecated"
  checked_on: "2026-09-17"

# The ordered keys are independently pinned by tests. Parent bullets and every
# API-bearing nested bullet in the selected section receive their own entry.
# The binhex bullet nests two API-bearing bullets naming binascii functions.
source_keys:
  - distutils-bdist-msi
  - math-factorial-float
  - parser-and-symbol-modules
  - pyparser-c-api-deprecations
  - notimplemented-boolean-context
  - random-seed-types
  - gzipfile-write-without-mode
  - tkinter-tkapptype-split
  - asyncio-wait-coroutines
  - binhex-module
  - binascii-b2a-hqx-a2b-hqx
  - binascii-rlecode-hqx-rledecode-hqx
  - ast-index-extslice
  - ast-suite-param-augload-augstore
  - pyeval-initthreads
  - shlex-split-none
  - smtpd-mailmanproxy
  - lib2to3-pending-deprecation
  - random-shuffle-random-parameter

entries:
  - source_key: distutils-bdist-msi
    disposition: duplicate
    rules: [CPY0023]
    note: The whole distutils namespace is classified from its 3.12 removal.
  - source_key: math-factorial-float
    disposition: not-statically-detectable
    note: >-
      Whether an argument is a float with an integral value is a runtime
      property; only a literal could be judged, and the rule would miss every
      variable.
  - source_key: parser-and-symbol-modules
    disposition: implemented
    rules: [CPY0138, CPY0185]
  - source_key: pyparser-c-api-deprecations
    disposition: c-api-roadmap
    note: >-
      PyParser_* and PyNode_Compile are C API; reserved for the separately
      designed C API roadmap.
  - source_key: notimplemented-boolean-context
    disposition: not-statically-detectable
    note: >-
      Which expressions evaluate to NotImplemented in a boolean context is a
      runtime property of comparator implementations.
  - source_key: random-seed-types
    disposition: not-statically-detectable
    note: >-
      The hashability and determinism of a seed value are runtime properties.
  - source_key: gzipfile-write-without-mode
    disposition: not-statically-detectable
    note: >-
      The deprecation applies to opening for writing without a mode; whether a
      GzipFile is written to is not visible at the call that opens it.
  - source_key: tkinter-tkapptype-split
    disposition: not-statically-detectable
    note: >-
      A method on a Tk application instance; arbitrary receiver types are
      outside the static alpha.
  - source_key: asyncio-wait-coroutines
    disposition: not-statically-detectable
    note: >-
      Whether the awaitables passed to asyncio.wait() are bare coroutines
      rather than tasks is a runtime property of the argument.
  - source_key: binhex-module
    disposition: implemented
    rules: [CPY0186]
  - source_key: binascii-b2a-hqx-a2b-hqx
    disposition: implemented
    rules: [CPY0187, CPY0188]
  - source_key: binascii-rlecode-hqx-rledecode-hqx
    disposition: implemented
    rules: [CPY0189, CPY0190]
  - source_key: ast-index-extslice
    disposition: implemented
    rules: [CPY0191, CPY0192]
  - source_key: ast-suite-param-augload-augstore
    disposition: not-applicable
    note: >-
      The page states these classes were never generated by the parser nor
      accepted by the code generator in Python 3; no working code constructs
      them. They remain importable through Python 3.14.
  - source_key: pyeval-initthreads
    disposition: c-api-roadmap
    note: >-
      PyEval_InitThreads and PyEval_ThreadsInitialized are C API; reserved for
      the separately designed C API roadmap.
  - source_key: shlex-split-none
    disposition: duplicate
    rules: [CPY0075]
    note: Already classified from its later removal.
  - source_key: smtpd-mailmanproxy
    disposition: duplicate
    rules: [CPY0016]
    note: The smtpd module is removed in Python 3.12, which covers every name in it.
  - source_key: lib2to3-pending-deprecation
    disposition: duplicate
    rules: [CPY0027]
    note: The module's schedule is classified from its later removal.
  - source_key: random-shuffle-random-parameter
    disposition: implemented
    rules: [CPY0193]
