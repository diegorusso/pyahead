  - source_key: locale-getdefaultlocale
    disposition: not-applicable
    note: >-
      Explicitly un-deprecated by CPython after this page was written. The
      registry's M5 rule for it is retired, and a test guards that it produces
      no finding.
  - source_key: locale-resetlocale
    disposition: duplicate
    rules: [CPY0029]
    note: >-
      Classified from the removal that followed.
  - source_key: re-numeric-group-reference-rules
    disposition: not-statically-detectable
    note: >-
      A change to how regular-expression pattern text is parsed; pattern
      strings are not analysed.
  - source_key: re-template
    disposition: duplicate
    rules: [CPY0032]
    note: >-
      re.template and the re.TEMPLATE and re.T flags are matched by the one
      rule.
  - source_key: turtle-settiltangle
    disposition: duplicate
    rules: [CPY0036]
    note: >-
      The module-level function was added to the rule alongside the class-
      qualified forms.
  - source_key: typing-text
