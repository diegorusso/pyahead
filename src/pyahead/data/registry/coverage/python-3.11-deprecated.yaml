schema_version: 1
source:
  id: python-3.11-deprecated
  title: "What's New in Python 3.11 — Deprecated"
  url: "https://docs.python.org/3.11/whatsnew/3.11.html#deprecated"
  checked_on: "2026-09-20"

# The ordered keys are independently pinned by tests. The section has four
# subsections — Language/Builtins, Modules, Standard Library, and Pending
# Removal in Python 3.12 — and the census walks them in order. Parent bullets
# and every API-bearing nested bullet receive their own entry. The last
# subsection re-lists the 3.10 deprecations already classified from the 3.12
# removals; each is recorded as a duplicate of the rule that carries it, which
# is what makes the claim that they are covered checkable.
