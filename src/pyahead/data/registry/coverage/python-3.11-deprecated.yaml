      Classified from the removal that followed.
  - source_key: importlib-resources-legacy-functions
    disposition: not-applicable
    note: >-
      The deprecation was reversed: the 3.13 documentation for these functions
      carries no deprecation note and they remain supported. The parent
      bullet; the six functions it names are recorded below for the census.
  - source_key: importlib-resources-is-resource
    disposition: not-applicable
    note: >-
      Deprecation reversed in Python 3.13; the function remains supported.
  - source_key: importlib-resources-open-binary
