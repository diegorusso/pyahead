entries:
  - source_key: classmethod-descriptor-chaining
    disposition: not-statically-detectable
    note: >-
      Whether a classmethod wraps another descriptor depends on the wrapped
      object's type at class creation, which the static alpha does not infer.
  - source_key: octal-escapes-above-0o377
    disposition: not-statically-detectable
    note: >-
      A literal-content pattern inside string and bytes literals; no matcher
      in the static alpha inspects escape sequences.
  - source_key: int-delegation-to-trunc
    disposition: not-statically-detectable
    note: >-
      Whether int() reaches __trunc__ depends on the argument's type at
      runtime.
  - source_key: pep-594-modules
    disposition: duplicate
    rules: [CPY0001, CPY0002, CPY0005, CPY0006, CPY0007, CPY0008, CPY0009, CPY0010, CPY0011, CPY0012, CPY0013, CPY0014, CPY0015, CPY0017, CPY0018, CPY0019, CPY0020, CPY0021, CPY0022]
    note: >-
      The nineteen PEP 594 modules are classified from PEP 594 and their 3.13
      removal.
  - source_key: asynchat-asyncore-smtpd
    disposition: duplicate
    rules: [CPY0003, CPY0004, CPY0016]
    note: >-
      Classified from PEP 594 and the 3.12 removal.
  - source_key: lib2to3
    disposition: duplicate
    rules: [CPY0027]
    note: >-
      Classified from the 3.13 removal.
  - source_key: sre-modules
    disposition: duplicate
    rules: [CPY0117]
    note: >-
      All three undocumented sre_* modules are matched by the one rule.
  - source_key: configparser-legacy-apis
    disposition: duplicate
    rules: [CPY0072]
    note: >-
      The parent bullet; the three APIs it names are classified below.
  - source_key: configparser-safeconfigparser
