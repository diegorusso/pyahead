  - source_key: traceback-exc-type
    disposition: partial
    rules: [CPY0103]
    note: Exact class-qualified references are detected; arbitrary TracebackException receivers require type inference.
  - source_key: typing-namedtuple-keyword-fields
    disposition: partial
    rules: [CPY0059]
    note: Explicit keyword-field forms are detected; expanded keyword mappings remain unknown.
  - source_key: typing-empty-functional-forms
    disposition: implemented
    rules: [CPY0059, CPY0060]
  - source_key: typing-no-type-check-decorator
