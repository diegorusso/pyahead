    disposition: implemented
    rules: [CPY0045]
  - source_key: argparse-nested-groups
    disposition: not-statically-detectable
    note: Proving that a group receiver was created from another group requires data-flow and receiver-type inference.
  - source_key: ast-legacy-constant-classes
    disposition: duplicate
    rules: [CPY0064]
    note: This parent bullet is decomposed into the five removed class bullets below.
  - source_key: ast-bytes
