    disposition: duplicate
    rules: [CPY0065]
    note: This parent bullet is decomposed into the two removed property bullets below.
  - source_key: ast-constant-n
    disposition: partial
    rules: [CPY0065]
    note: Exact Constant-qualified references are detected; arbitrary Constant receiver types are not inferred.
  - source_key: ast-constant-s
