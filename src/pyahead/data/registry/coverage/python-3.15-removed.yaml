schema_version: 1
source:
  id: python-3.15-removed
  title: "What's New in Python 3.15 — Removed"
  url: "https://docs.python.org/3.15/whatsnew/3.15.html#removed"
  checked_on: "2026-10-10"

# The ordered keys are independently pinned by tests and enumerate every
# top-level and nested API bullet in the selected section of the 3.15.0 page.
source_keys:
  - ast-node-constructor-arguments
  - collections-abc-bytestring-all
  - ctypes-setpointertype
  - datetime-strptime-day-without-year
  - glob-glob0-glob1
  - http-server-cgihttprequesthandler
  - importlib-loader-load-module
  - importlib-resources-files-package
  - pathlib-purepath-is-reserved
  - platform-java-ver
  - sre-modules
  - sysconfig-is-python-build-check-home
  - threading-rlock-arguments
  - types-codetype-co-lnotab
  - typing-bytestring-all
  - typing-namedtuple-keyword-fields
  - typing-typeddict-zero-fields
  - typing-no-type-check-decorator
  - wave-marker-methods
  - zipimport-zipimporter-load-module

entries:
  - source_key: ast-node-constructor-arguments
    disposition: not-statically-detectable
    note: Knowing which fields a node class requires and accepts needs the per-class field schema, which the closed matcher schema cannot express.
  - source_key: collections-abc-bytestring-all
    disposition: duplicate
    rules: [CPY0044]
    note: Only the name's presence in __all__ changed; the class itself and its Python 3.17 removal are represented by CPY0044.
  - source_key: ctypes-setpointertype
    disposition: implemented
    rules: [CPY0050]
  - source_key: datetime-strptime-day-without-year
    disposition: not-statically-detectable
    note: The closed matcher schema cannot express the content of a format string.
  - source_key: glob-glob0-glob1
    disposition: implemented
    rules: [CPY0049]
  - source_key: http-server-cgihttprequesthandler
    disposition: partial
    rules: [CPY0054]
    note: The handler class is detected; the --cgi command-line flag is not Python source.
  - source_key: importlib-loader-load-module
    disposition: partial
    rules: [CPY0137]
    note: Exact class-qualified references are detected; load_module methods defined on custom loader subclasses require class analysis.
  - source_key: importlib-resources-files-package
    disposition: implemented
    rules: [CPY0211]
  - source_key: pathlib-purepath-is-reserved
    disposition: partial
    rules: [CPY0055]
    note: Exact class-qualified references are detected; arbitrary path receivers require type inference.
  - source_key: platform-java-ver
    disposition: implemented
    rules: [CPY0052]
  - source_key: sre-modules
    disposition: implemented
    rules: [CPY0117]
  - source_key: sysconfig-is-python-build-check-home
    disposition: implemented
    rules: [CPY0058]
  - source_key: threading-rlock-arguments
    disposition: partial
    rules: [CPY0057]
    note: Statically visible positional and explicit keyword arguments are detected; expanded keyword mappings remain unknown.
  - source_key: types-codetype-co-lnotab
    disposition: partial
    rules: [CPY0135]
    note: Exact CodeType-qualified references are detected; arbitrary code-object receiver types require type inference.
  - source_key: typing-bytestring-all
    disposition: duplicate
    rules: [CPY0091]
    note: Only the name's presence in __all__ changed; the class itself and its Python 3.17 removal are represented by CPY0091.
  - source_key: typing-namedtuple-keyword-fields
    disposition: partial
    rules: [CPY0059]
    note: Explicit keyword-field forms are detected; expanded keyword mappings remain unknown.
  - source_key: typing-typeddict-zero-fields
    disposition: implemented
    rules: [CPY0060]
  - source_key: typing-no-type-check-decorator
    disposition: implemented
    rules: [CPY0053]
  - source_key: wave-marker-methods
    disposition: partial
    rules: [CPY0056]
    note: Exact class-qualified references are detected; arbitrary wave reader and writer receivers require type inference.
  - source_key: zipimport-zipimporter-load-module
    disposition: partial
    rules: [CPY0114]
    note: Exact class-qualified references are detected; arbitrary importer receivers require type inference.
