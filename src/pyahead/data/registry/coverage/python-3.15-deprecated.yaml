  - module-version-xml-sax-expatreader
  - module-version-xml-sax-handler
  - module-version-zlib

entries:
  - source_key: ast-abstract-node-instantiation
    disposition: implemented
    rules: [CPY0209]
  - source_key: base64-alternative-alphabet-plus-slash
    disposition: not-statically-detectable
    note: Whether decoded input contains + or / alongside an alternative alphabet is a runtime value.
  - source_key: cli-bytes-warning-options
    disposition: not-applicable
    note: The -b and -bb options are interpreter command-line flags, not Python source.
  - source_key: collections-abc-bytestring-runtime-warning
    disposition: duplicate
    rules: [CPY0044]
    note: This parent bullet is decomposed into the two statement bullets below.
  - source_key: collections-abc-bytestring-from-import
    disposition: duplicate
    rules: [CPY0044]
    note: The Python 3.12 deprecation of the same class is represented by CPY0044.
  - source_key: collections-abc-bytestring-attribute
    disposition: duplicate
    rules: [CPY0044]
    note: The Python 3.12 deprecation of the same class is represented by CPY0044.
  - source_key: hashlib-string-keyword
    disposition: implemented
    rules: [CPY0208]
  - source_key: http-cookies-js-output
    disposition: partial
    rules: [CPY0207]
    note: Exact Morsel, BaseCookie and SimpleCookie references are detected; arbitrary cookie receivers require type inference.
  - source_key: imaplib-imap4-file-assignment
    disposition: not-statically-detectable
    note: Recognizing an assignment to the file attribute of an IMAP4 instance requires type inference.
  - source_key: profile-module
    disposition: implemented
    rules: [CPY0205]
  - source_key: re-match-soft-deprecation
    disposition: not-applicable
    note: A soft deprecation with no removal plan, and CPython advises code supporting older versions to keep using match(); reporting it would give the wrong advice.
  - source_key: struct-new-and-reinit
    disposition: not-statically-detectable
    note: Calling Struct.__new__ directly or re-running __init__ on an initialized object needs receiver and call-history inference.
  - source_key: struct-f-d-type-codes
    disposition: not-statically-detectable
    note: The closed matcher schema cannot express the content of a format string; the soft deprecation also has no removal plan.
  - source_key: typing-bytestring-runtime-warning
    disposition: duplicate
    rules: [CPY0091]
    note: This parent bullet is decomposed into the two statement bullets below.
  - source_key: typing-bytestring-from-import
    disposition: duplicate
    rules: [CPY0091]
    note: The Python 3.9 deprecation of the same class is represented by CPY0091.
  - source_key: typing-bytestring-attribute
    disposition: duplicate
    rules: [CPY0091]
    note: The Python 3.9 deprecation of the same class is represented by CPY0091.
  - source_key: typing-protocol-inherited-runtime-checkable
    disposition: not-statically-detectable
    note: Whether a protocol inherits runtime_checkable without being decorated itself, and whether isinstance receives it, needs class analysis.
  - source_key: webbrowser-macosxosascript
    disposition: implemented
    rules: [CPY0206]
  - source_key: module-version-attributes
    disposition: duplicate
    rules: [CPY0210]
    note: This parent bullet is decomposed into the twenty-four named module bullets below.
  - source_key: module-version-argparse
    disposition: implemented
    rules: [CPY0210]
  - source_key: module-version-csv
    disposition: implemented
