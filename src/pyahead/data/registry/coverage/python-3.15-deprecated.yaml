schema_version: 1
source:
  id: python-3.15-deprecated
  title: "What's New in Python 3.15 — Deprecated › New deprecations"
  url: "https://docs.python.org/3.15/whatsnew/3.15.html#new-deprecations"
  checked_on: "2026-10-10"

# The ordered keys are independently pinned by tests and enumerate every
# top-level and nested API bullet in the selected section of the 3.15.0 page.
source_keys:
  - ast-abstract-node-instantiation
  - base64-alternative-alphabet-plus-slash
  - cli-bytes-warning-options
  - collections-abc-bytestring-runtime-warning
  - collections-abc-bytestring-from-import
  - collections-abc-bytestring-attribute
  - hashlib-string-keyword
  - http-cookies-js-output
  - imaplib-imap4-file-assignment
  - profile-module
  - re-match-soft-deprecation
  - struct-new-and-reinit
  - struct-f-d-type-codes
  - typing-bytestring-runtime-warning
  - typing-bytestring-from-import
  - typing-bytestring-attribute
  - typing-protocol-inherited-runtime-checkable
  - webbrowser-macosxosascript
  - module-version-attributes
  - module-version-argparse
  - module-version-csv
  - module-version-ctypes
  - module-version-ctypes-macholib
  - module-version-decimal
  - module-version-http-server
